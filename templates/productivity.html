{% extends "base.html" %}
{% block content %}
<h1>Productivity</h1>
<div class="card">
    <h3>To-Do List</h3>
    <form method="post" action="/productivity/todo/add" class="inline-form">
        <input type="text" name="title" placeholder="New task" required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for t in todos %}
        <li style="{% if t.done %}text-decoration:line-through;color:gray;{% endif %}">
            <a href="/productivity/todo/{{ t.id }}/toggle">✓</a> {{ t.title }}
        </li>
        {% endfor %}
    </ul>
</div>

<div class="card">
    <h3>Expenses (Total: ₹{{ total_spent }})</h3>
    <form method="post" action="/productivity/expense/add" class="inline-form">
        <input type="text" name="category" placeholder="Category" required>
        <input type="number" step="0.01" name="amount" placeholder="Amount" required>
        <button type="submit">Add</button>
    </form>
    <ul>{% for e in expenses %}<li>{{ e.category }} — ₹{{ e.amount }}</li>{% endfor %}</ul>
</div>
{% endblock %}
